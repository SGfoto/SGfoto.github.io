<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S.G. Foto</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1e2a38;
      --accent: #ff6b00;
      --text: #f0f0f0;
      --card: #2a3a4c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(135deg, var(--bg), #121820);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      background-color: var(--card);
      padding: 3rem 2rem;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .highlight {
      color: var(--accent);
      font-weight: bold;
    }

    .button {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background-color: var(--accent);
      border: none;
      border-radius: 12px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #e85f00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span style="padding-bottom: 10px; display: block;">📸</span> S.G. Foto</h1>
    <p>Deze pagina wordt <span class="highlight">geïntegreerd</span> binnen <strong>SennaGerrits.nl</strong> 🌐</p>
    <p>Vanaf nu kunt u alle foto's vinden op de nieuwe website.</p>
    <p>📅 Deze website komt te vervallen op <strong>11 juni 2025</strong>.</p>
    <a href="https://sennagerrits.nl/fotografie" class="button">🌍 Ga naar de nieuwe site</a>
  </div>
</body>
</html>
